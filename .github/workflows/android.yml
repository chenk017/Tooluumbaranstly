name: Build Android APK


on:

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest


    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17



    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.408



    - name: Check SDK
      run: |
        dotnet --version
        dotnet --list-sdks



    - name: Install Android workload
      run: |
        dotnet workload install android



    - name: Restore
      run: |
        dotnet restore \
        UmbaranAssetBrowserUI/UmbaranAssetBrowserUI.Android.csproj



    - name: Publish APK
      run: |
        dotnet publish \
        UmbaranAssetBrowserUI/UmbaranAssetBrowserUI.Android.csproj \
        -c Release \
        -f net8.0-android34.0 \
        -r android-arm64 \
        /p:AndroidPackageFormat=apk



    - name: Check APK
      run: |
        find . -name "*.apk"
        file $(find . -name "*.apk" | head -1)



    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:

        name: UmbaranAssetBrowser-arm64

        path: |

          UmbaranAssetBrowserUI/bin/Release/**/*.apk
