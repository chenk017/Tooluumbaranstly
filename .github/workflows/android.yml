name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-android:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'


      - name: Install Android workload
        run: |
          dotnet workload install android


      - name: Restore
        run: |
          dotnet restore UmbaranAssetBrowserUI/UmbaranAssetBrowserUI.Android.csproj


      - name: Build APK
        run: |
          dotnet build UmbaranAssetBrowserUI/UmbaranAssetBrowserUI.Android.csproj \
          -c Release \
          -f net8.0-android \
          /p:AndroidPackageFormat=apk


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UmbaranAssetBrowser-debug-apk
          path: |
            **/bin/Release/**/*.apk
