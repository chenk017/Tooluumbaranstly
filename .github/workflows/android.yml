name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:

  build-android:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x


    - name: Install Android Workload
      run: |
        dotnet workload install android


    - name: Check csproj
      run: |
        echo "=== CSProj size ==="
        wc -c UmbaranAssetBrowserUI/UmbaranAssetBrowserUI.Android.csproj

        echo "=== First lines ==="
        head -20 UmbaranAssetBrowserUI/UmbaranAssetBrowserUI.Android.csproj


    - name: Restore
      run: |
        dotnet restore UmbaranAssetBrowserUI/UmbaranAssetBrowserUI.Android.csproj


    - name: Build APK
      run: |
        dotnet build \
        UmbaranAssetBrowserUI/UmbaranAssetBrowserUI.Android.csproj \
        -c Release \
        -f net8.0-android34.0


    - name: Find APK
      run: |
        find . -name "*.apk"


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: UmbaranAssetBrowserAPK
        path: "**/*.apk"
