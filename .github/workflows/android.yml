name: Build Android APK


on:
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17


    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.408


    - name: Verify SDK
      run: |
        dotnet --version
        dotnet --list-sdks


    - name: Install Android workload
      run: |
        dotnet workload install android


    - name: Restore Workloads
      run: |
        dotnet workload restore \
        UmbaranAssetBrowserUI/UmbaranAssetBrowserUI.Android.csproj


    - name: Build APK
      run: |
        dotnet publish \
        UmbaranAssetBrowserUI/UmbaranAssetBrowserUI.Android.csproj \
        -c Release \
        -f net8.0-android34.0 \
        /p:AndroidPackageFormat=apk


    - name: Find APK
      run: |
        find . -name "*.apk"


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: UmbaranAssetBrowser-APK
        path: |
          UmbaranAssetBrowserUI/bin/Release/**/*.apk
