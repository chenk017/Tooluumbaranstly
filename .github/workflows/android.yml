name: gacor777

on:
  workflow_dispatch:


jobs:

  android-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.130'


      - name: Verify SDK
        run: |
          echo "=== DOTNET VERSION ==="
          dotnet --version

          echo ""
          echo "=== SDK LIST ==="
          dotnet --list-sdks


      - name: Install Android workload
        run: |
          dotnet workload install android


      - name: Find Android Target Source
        run: |
          echo "=== PROJECT FILES ==="
          find . -name "*.csproj"

          echo ""
          echo "=== PROPS AND TARGETS ==="
          find . -name "*.props" -o -name "*.targets"

          echo ""
          echo "=== SEARCH android21 ==="
          grep -R "android21" . || true

          echo ""
          echo "=== SEARCH TargetFramework ==="
          grep -R "TargetFramework" .


      - name: Show Android Project
        run: |
          echo "=== Android csproj ==="
          cat ./UmbaranAssetBrowserUI/UmbaranAssetBrowserUI.Android.csproj


      - name: Restore Android Project
        run: |
          dotnet restore ./UmbaranAssetBrowserUI/UmbaranAssetBrowserUI.Android.csproj


      - name: Build APK
        run: |
          dotnet build ./UmbaranAssetBrowserUI/UmbaranAssetBrowserUI.Android.csproj \
          -c Release \
          -f net8.0-android34.0 \
          /p:AndroidPackageFormat=apk


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UmbaranAssetBrowser-APK
          path: |
            UmbaranAssetBrowserUI/bin/Release/**/*.apk
