name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.408'


    - name: Check Dotnet
      run: |
        dotnet --version
        dotnet --list-sdks


    - name: Force Android Target
      run: |
        sed -i 's/net8.0-android21.0/net8.0-android34.0/g' \
        UmbaranAssetBrowserUI/*.csproj

        grep -R "TargetFramework" UmbaranAssetBrowserUI/


    - name: Install Android workload
      run: |
        dotnet workload install android --ignore-failed-sources


    - name: Publish APK
      run: |
        dotnet publish \
        UmbaranAssetBrowserUI/UmbaranAssetBrowserUI.Android.csproj \
        -c Release \
        -f net8.0-android34.0 \
        -r android-arm64 \
        /p:AndroidPackageFormat=apk


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: UmbaranAssetBrowser-arm64
        path: |
          UmbaranAssetBrowserUI/bin/Release/**/*.apk
