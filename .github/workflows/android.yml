name: Build Android APK

on:
  workflow_dispatch:


jobs:
  build:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17


    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x


    - name: Check Android SDK
      run: |
        echo $ANDROID_HOME
        ls $ANDROID_HOME
        sdkmanager --list | head -20


    - name: Install Android workload
      run: |
        dotnet workload install android


    - name: Restore
      run: |
        dotnet restore \
        UmbaranAssetBrowserUI/UmbaranAssetBrowserUI.Android.csproj


    - name: Build APK
      run: |
        dotnet publish \
        UmbaranAssetBrowserUI/UmbaranAssetBrowserUI.Android.csproj \
        -c Release \
        -f net8.0-android34.0 \
        /p:AndroidPackageFormat=apk


    - name: Find APK
      run: |
        find . -name "*.apk"


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: UmbaranAssetBrowser-release
        path: |
          UmbaranAssetBrowserUI/bin/Release/**/*.apk
