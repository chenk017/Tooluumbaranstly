name: Build Umbaran Asset Browser APK

on:
  workflow_dispatch:


jobs:

  build-android:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4


    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'


    - name: Show Environment
      run: |
        dotnet --version
        dotnet --list-sdks


    - name: Install Android Workload
      run: |
        dotnet workload install android


    - name: Clean Old Build
      run: |
        dotnet clean \
        UmbaranAssetBrowserUI/UmbaranAssetBrowserUI.Android.csproj


    - name: Restore Android Project
      run: |
        dotnet restore \
        UmbaranAssetBrowserUI/UmbaranAssetBrowserUI.Android.csproj \
        -p:TargetFramework=net8.0-android34.0


    - name: Build APK
      run: |
        dotnet publish \
        UmbaranAssetBrowserUI/UmbaranAssetBrowserUI.Android.csproj \
        -c Release \
        -f net8.0-android34.0 \
        -r android-arm64 \
        --no-restore \
        /p:AndroidPackageFormat=apk \
        /p:AndroidCreatePackagePerAbi=false


    - name: Find APK
      run: |
        find UmbaranAssetBrowserUI/bin -name "*.apk"


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: UmbaranAssetBrowser-arm64
        path: |
          UmbaranAssetBrowserUI/bin/**/*.apk
