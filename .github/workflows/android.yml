name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17


    - name: Install .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.408'


    - name: Force .NET 8
      run: |
        echo '{"sdk":{"version":"8.0.408","rollForward":"latestPatch"}}' > global.json
        dotnet --version
        dotnet --list-sdks


    - name: Install Android workload
      run: |
        dotnet workload install android


    - name: Restore
      run: |
        dotnet restore ./UmbaranAssetBrowserUI/UmbaranAssetBrowserUI.Android.csproj


    - name: Publish APK
      run: |
        dotnet publish \
        ./UmbaranAssetBrowserUI/UmbaranAssetBrowserUI.Android.csproj \
        -c Release \
        -f net8.0-android34.0 \
        /p:AndroidPackageFormat=apk


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: UmbaranAssetBrowser-APK
        path: |
          UmbaranAssetBrowserUI/bin/Release/**/*.apk
