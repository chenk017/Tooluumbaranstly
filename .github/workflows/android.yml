name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:

  build-android:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4


    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x


    - name: Install Android Workload
      run: |
        dotnet workload install android


    - name: Restore Android Project
      run: |
        dotnet restore \
        UmbaranAssetBrowserUI/UmbaranAssetBrowserUI.Android.csproj


    - name: Clean Build Cache
      run: |
        rm -rf UmbaranAssetBrowserUI/bin
        rm -rf UmbaranAssetBrowserUI/obj


    - name: Build APK
      run: |
        dotnet build \
        UmbaranAssetBrowserUI/UmbaranAssetBrowserUI.Android.csproj \
        -c Release \
        -f net8.0-android34.0 \
        --no-restore


    - name: Find APK
      run: |
        find UmbaranAssetBrowserUI -name "*.apk"


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: UmbaranAssetBrowserAPK
        path: |
          UmbaranAssetBrowserUI/**/*.apk
